    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        import pako from "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.esm.mjs";

        const supabase = createClient(
            "https://gmgwincdfreawxtzwncc.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZ3dpbmNkZnJlYXd4dHp3bmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDA1OTUsImV4cCI6MjA5NTQ3NjU5NX0.w-gFEvJchg3EFe97XcK4VjX-7I5DhcWMXdt3oMnLOZA"
        );

        const TILE_W = 256, TILE_H = 96;
        const GAP = 12;
        const DEFAULT_BG = "#fff5f7";
        const UNDO_LIMIT = 50;

        let userId = null;
        let mySlot = null;
        let myOwners = [];

        let tool = "pen";
        let drawing = false;
        let lastX = null, lastY = null;
        let dirty = false;
        let saveTimer = null;

        let undoStack = [];
        let redoStack = [];

        let registered = false;

        let panning = false;
        let panStartX = 0, panStartY = 0;
        let panScrollX = 0, panScrollY = 0;
        let panVelX = 0, panVelY = 0;
        let panLastX = 0, panLastY = 0;
        let panRafId = null;

        let zoom = 1;
        const ZOOM_MIN = 0.25;
        const ZOOM_MAX = 8;
        const ZOOM_STEP = 0.12;

        const tileBySlot = new Map();
        const slotHasPending = new Map();

        const ALLOW_SELF_MERGE = true;

        const world = document.getElementById("gb-world");
        const canvasArea = document.getElementById("gb-canvas-area");
        const status = document.getElementById("gb-nav-right");
        const hint = document.getElementById("gb-viewport-hint");
        const colorPick = document.getElementById("gb-color");
        const sizeSlider = document.getElementById("gb-pen-size");
        const ctxMenu = document.getElementById("gb-ctx-menu");
        const ctxMerge = document.getElementById("gb-ctx-merge");
        const ctxClose = document.getElementById("gb-ctx-close");

        let ctxTargetSlot = null;

        function updateSliderFill() {
            const pct = ((+sizeSlider.value - +sizeSlider.min) / (+sizeSlider.max - +sizeSlider.min) * 100).toFixed(1) + "%";
            sizeSlider.style.setProperty("--fill", pct);
        }
        sizeSlider.addEventListener("input", updateSliderFill);
        updateSliderFill();

        window.addEventListener("load", () => {
            requestIdleCallback(async () => {
                const wait = (min, max) =>
                    new Promise(r => setTimeout(r, Math.random() * (max - min) + min));
                await wait(100, 600);
                console.log("[server] hmm bobby");
                await wait(100, 600);
                const fullUrl = new URL("./bobby.gif", window.location.href).href;
                console.log("[client]", fullUrl);
            });
        });

        const WORLD_SIZE = 20000;
        const ORIGIN_X = Math.floor(WORLD_SIZE / 2 - TILE_W / 2);
        const ORIGIN_Y = Math.floor(WORLD_SIZE / 2 - TILE_H / 2);

        world.style.width = WORLD_SIZE + "px";
        world.style.height = WORLD_SIZE + "px";
        world.style.transformOrigin = "0 0";
        world.style.transform = `scale(${zoom})`;

        function slotToXY(slot) {
            if (slot === 0) return { x: ORIGIN_X, y: ORIGIN_Y };

            let x = 0, y = 0;
            let dx = 1, dy = 0;
            let steps = 1;
            let stepCount = 0;
            let turns = 0;
            let i = 0;

            while (i < slot) {
                x += dx; y += dy;
                i++;
                if (i === slot) break;
                stepCount++;
                if (stepCount === steps) {
                    stepCount = 0;
                    [dx, dy] = [dy, -dx];
                    turns++;
                    if (turns % 2 === 0) steps++;
                }
            }

            return {
                x: ORIGIN_X + x * (TILE_W + GAP),
                y: ORIGIN_Y + y * (TILE_H + GAP),
            };
        }

        function uint8ToBase64(bytes) {
            let str = "";
            const CHUNK = 0x8000;
            for (let i = 0; i < bytes.length; i += CHUNK)
                str += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
            return btoa(str);
        }

        function base64ToUint8(b64) {
            const binary = atob(b64);
            const out = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
            return out;
        }

        function imgSrcToImageData(src) {
            return new Promise((resolve, reject) => {
                if (src.startsWith("rawrgba:")) {
                    const bytes = base64ToUint8(src.slice(8));
                    const raw = pako.inflate(bytes);
                    resolve(new ImageData(new Uint8ClampedArray(raw.buffer), TILE_W, TILE_H));
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    const tmp = document.createElement("canvas");
                    tmp.width = TILE_W; tmp.height = TILE_H;
                    const tmpCtx = tmp.getContext("2d", { willReadFrequently: true });
                    tmpCtx.drawImage(img, 0, 0);
                    resolve(tmpCtx.getImageData(0, 0, TILE_W, TILE_H));
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        async function canvasToLosslessDataURL(canvas) {
            const ctx = canvas.getContext("2d");
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const compressed = pako.deflate(imageData.data);
            return "rawrgba:" + uint8ToBase64(compressed);
        }

        function isValidImage(src) {
            return typeof src === "string" && (
                src.startsWith("rawrgba:") ||
                src.startsWith("data:") ||
                src.startsWith("http")
            );
        }

        function createTileCanvas(slot, imageData) {
            const { x, y } = slotToXY(slot);
            const c = document.createElement("canvas");
            c.width = TILE_W; c.height = TILE_H;
            c.className = "gb-tile";
            c.style.left = x + "px";
            c.style.top = y + "px";
            c.dataset.slot = slot;
            const ctx = c.getContext("2d");
            if (imageData) { ctx.putImageData(imageData, 0, 0); }
            else { ctx.fillStyle = DEFAULT_BG; ctx.fillRect(0, 0, TILE_W, TILE_H); }
            world.appendChild(c);
            tileBySlot.set(slot, c);
            return c;
        }

        let myCanvas = null, myCtx = null;

        function createMyCanvas(slot) {
            const { x, y } = slotToXY(slot);
            myCanvas = document.createElement("canvas");
            myCanvas.id = "gb-mine-canvas";
            myCanvas.width = TILE_W; myCanvas.height = TILE_H;
            myCanvas.classList.add("gb-tile", "gb-tile-mine");
            myCanvas.style.left = x + "px";
            myCanvas.style.top = y + "px";
            myCanvas.dataset.slot = slot;
            world.appendChild(myCanvas);
            myCtx = myCanvas.getContext("2d", { willReadFrequently: true });
            tileBySlot.set(slot, myCanvas);
        }

        function loadMyImage(imageData) {
            if (imageData) { myCtx.putImageData(imageData, 0, 0); }
            else { myCtx.fillStyle = DEFAULT_BG; myCtx.fillRect(0, 0, TILE_W, TILE_H); }
        }

        function snapshotForUndo() {
            undoStack.push(myCtx.getImageData(0, 0, TILE_W, TILE_H));
            if (undoStack.length > UNDO_LIMIT) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (!undoStack.length) return;
            redoStack.push(myCtx.getImageData(0, 0, TILE_W, TILE_H));
            myCtx.putImageData(undoStack.pop(), 0, 0);
            dirty = true; scheduleSave();
        }

        function redo() {
            if (!redoStack.length) return;
            undoStack.push(myCtx.getImageData(0, 0, TILE_W, TILE_H));
            myCtx.putImageData(redoStack.pop(), 0, 0);
            dirty = true; scheduleSave();
        }

        function clearCanvas() {
            if (!myCanvas) return;
            snapshotForUndo();
            myCtx.fillStyle = DEFAULT_BG;
            myCtx.fillRect(0, 0, TILE_W, TILE_H);
            dirty = true; scheduleSave();
        }

        document.addEventListener("keydown", e => {
            const ctrl = e.ctrlKey || e.metaKey;
            if (e.key === "c" || e.key === "C") { e.preventDefault(); clearCanvas(); }
            if (e.key === "f" || e.key === "F") { e.preventDefault(); scrollToMyTile(); }
            if (!ctrl) return;
            if (e.key === "z" || e.key === "Z") {
                if (e.shiftKey) { e.preventDefault(); redo(); }
                else { e.preventDefault(); undo(); }
            }
            if (e.key === "y" || e.key === "Y") { e.preventDefault(); redo(); }
        });

        function worldPosFromEvent(e) {
            const rect = canvasArea.getBoundingClientRect();
            return {
                wx: (e.clientX - rect.left + canvasArea.scrollLeft) / zoom,
                wy: (e.clientY - rect.top + canvasArea.scrollTop) / zoom,
            };
        }

        function inMyTile(wx, wy) {
            if (!myCanvas) return false;
            const { x, y } = slotToXY(mySlot);
            return wx >= x && wx < x + TILE_W && wy >= y && wy < y + TILE_H;
        }

        function slotAtWorldPos(wx, wy) {
            for (const [slot] of tileBySlot) {
                const { x, y } = slotToXY(slot);
                if (wx >= x && wx < x + TILE_W && wy >= y && wy < y + TILE_H) return slot;
            }
            return null;
        }

        function drawAt(wx, wy, fromX, fromY) {
            if (!myCanvas) return;
            const { x: ox, y: oy } = slotToXY(mySlot);
            const cx = wx - ox, cy = wy - oy;
            myCtx.save();
            myCtx.lineWidth = parseInt(sizeSlider.value, 10);
            myCtx.lineCap = "round";
            myCtx.lineJoin = "round";
            myCtx.strokeStyle = (tool === "eraser") ? DEFAULT_BG : colorPick.value;
            myCtx.globalCompositeOperation = "source-over";
            myCtx.beginPath();
            if (fromX !== null && fromY !== null) {
                myCtx.moveTo(fromX - ox, fromY - oy);
                myCtx.lineTo(cx, cy);
            } else {
                myCtx.moveTo(cx, cy);
                myCtx.lineTo(cx, cy);
            }
            myCtx.stroke();
            myCtx.restore();
            dirty = true; scheduleSave();
        }

        function applyZoom(newZoom, pivotClientX, pivotClientY) {
            newZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newZoom));
            if (newZoom === zoom) return;
            const rect = canvasArea.getBoundingClientRect();
            const wx = (pivotClientX - rect.left + canvasArea.scrollLeft) / zoom;
            const wy = (pivotClientY - rect.top + canvasArea.scrollTop) / zoom;
            zoom = newZoom;
            world.style.transform = `scale(${zoom})`;
            canvasArea.scrollLeft = wx * zoom - (pivotClientX - rect.left);
            canvasArea.scrollTop = wy * zoom - (pivotClientY - rect.top);
        }

        function scrollToMyTile() {
            const { x, y } = slotToXY(mySlot);
            canvasArea.scrollLeft = x * zoom + (TILE_W * zoom) / 2 - canvasArea.clientWidth / 2;
            canvasArea.scrollTop = y * zoom + (TILE_H * zoom) / 2 - canvasArea.clientHeight / 2;
            if (canvasArea.scrollLeft < 0) canvasArea.scrollLeft = 0;
            if (canvasArea.scrollTop < 0) canvasArea.scrollTop = 0;
        }

        canvasArea.addEventListener("dragstart", e => e.preventDefault());
        world.addEventListener("dragstart", e => e.preventDefault());

        canvasArea.addEventListener("wheel", e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
            applyZoom(zoom + delta * zoom, e.clientX, e.clientY);
        }, { passive: false });

        function startMomentum() {
            cancelAnimationFrame(panRafId);
            const FRICTION = 0.85;
            function tick() {
                if (Math.abs(panVelX) < 0.3 && Math.abs(panVelY) < 0.3) return;
                canvasArea.scrollLeft += panVelX;
                canvasArea.scrollTop += panVelY;
                panVelX *= FRICTION;
                panVelY *= FRICTION;
                panRafId = requestAnimationFrame(tick);
            }
            panRafId = requestAnimationFrame(tick);
        }

        let drawPending = false;
        let pendingWx = 0, pendingWy = 0;

        canvasArea.addEventListener("mousedown", e => {
            if (e.button === 2) return;
            e.preventDefault();
            hideCtxMenu();
            cancelAnimationFrame(panRafId);
            panVelX = 0; panVelY = 0;
            const { wx, wy } = worldPosFromEvent(e);
            if (inMyTile(wx, wy)) {
                tool = "pen";
                snapshotForUndo();
                drawing = true;
                drawAt(wx, wy, null, null);
                lastX = wx; lastY = wy;
            } else {
                panning = true;
                panStartX = e.clientX; panStartY = e.clientY;
                panScrollX = canvasArea.scrollLeft; panScrollY = canvasArea.scrollTop;
                panLastX = e.clientX; panLastY = e.clientY;
            }
        });

        canvasArea.addEventListener("mousemove", e => {
            if (drawing) {
                const { wx, wy } = worldPosFromEvent(e);
                pendingWx = wx; pendingWy = wy;
                if (!drawPending) {
                    drawPending = true;
                    requestAnimationFrame(() => {
                        drawAt(pendingWx, pendingWy, lastX, lastY);
                        lastX = pendingWx; lastY = pendingWy;
                        drawPending = false;
                    });
                }
            } else if (panning) {
                panVelX = -(e.clientX - panLastX);
                panVelY = -(e.clientY - panLastY);
                panLastX = e.clientX; panLastY = e.clientY;
                canvasArea.scrollLeft = panScrollX - (e.clientX - panStartX);
                canvasArea.scrollTop = panScrollY - (e.clientY - panStartY);
            }
        });

        function stopDraw() { drawing = false; lastX = null; lastY = null; }
        function stopPan() { if (panning) { panning = false; startMomentum(); } }

        canvasArea.addEventListener("mouseup", () => { stopDraw(); stopPan(); });
        canvasArea.addEventListener("mouseleave", () => { stopDraw(); stopPan(); });

        function hideCtxMenu() {
            ctxMenu.classList.remove("show");
            ctxTargetSlot = null;
        }

        function showCtxMenu(clientX, clientY, slot) {
            if (slot === mySlot && !ALLOW_SELF_MERGE) { hideCtxMenu(); return; }

            ctxTargetSlot = slot;

            const isSelf = slot === mySlot;
            const hasPending = !isSelf && slotHasPending.get(slot) === true;
            if (isSelf) {
                ctxMerge.textContent = "test self-merge (dev)";
                ctxMerge.classList.remove("disabled");
            } else if (hasPending) {
                ctxMerge.textContent = "merge request pending";
                ctxMerge.classList.add("disabled");
            } else {
                ctxMerge.textContent = "request merge";
                ctxMerge.classList.remove("disabled");
            }

            const menuW = 160, menuH = 80;
            let left = clientX + 4;
            let top = clientY + 4;
            if (left + menuW > window.innerWidth) left = clientX - menuW - 4;
            if (top + menuH > window.innerHeight) top = clientY - menuH - 4;
            ctxMenu.style.left = left + "px";
            ctxMenu.style.top = top + "px";
            ctxMenu.classList.add("show");
        }

        canvasArea.addEventListener("contextmenu", e => {
            e.preventDefault();
            const { wx, wy } = worldPosFromEvent(e);
            const slot = slotAtWorldPos(wx, wy);
            if (slot === null) { hideCtxMenu(); return; }
            if (slot === mySlot && !ALLOW_SELF_MERGE) { hideCtxMenu(); return; }
            showCtxMenu(e.clientX, e.clientY, slot);
        });

        let longPressTimer = null;
        let longPressPos = null;

        canvasArea.addEventListener("touchstart", e => {
            if (e.touches.length !== 1) return;
            const touch = e.touches[0];
            longPressPos = { x: touch.clientX, y: touch.clientY };
            longPressTimer = setTimeout(() => {
                const rect = canvasArea.getBoundingClientRect();
                const wx = (longPressPos.x - rect.left + canvasArea.scrollLeft) / zoom;
                const wy = (longPressPos.y - rect.top + canvasArea.scrollTop) / zoom;
                const slot = slotAtWorldPos(wx, wy);
                if (slot === null) return;
                if (slot === mySlot && !ALLOW_SELF_MERGE) return;
                showCtxMenu(longPressPos.x, longPressPos.y, slot);
            }, 500);
        }, { passive: true });

        canvasArea.addEventListener("touchmove", () => {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }, { passive: true });

        canvasArea.addEventListener("touchend", () => {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        });

        document.addEventListener("mousedown", e => {
            if (!ctxMenu.contains(e.target)) hideCtxMenu();
        });

        ctxClose.addEventListener("click", hideCtxMenu);

        ctxMerge.addEventListener("click", () => {
            if (ctxMerge.classList.contains("disabled")) return;
            const slot = ctxTargetSlot;
            hideCtxMenu();
            if (slot === null) return;
            if (!registered && slot !== mySlot) {
                status.textContent = "draw something first! :3";
                return;
            }
            showMergeRequestConfirm(slot);
        });

        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveMyTile, 1500);
        }

        async function saveMyTile() {
            if (!dirty || !myCanvas || userId === null) return;
            dirty = false;
            status.textContent = "saving...";
            try {
                const { error } = await supabase.from("tiles").upsert({
                    slot: mySlot,
                    image: await canvasToLosslessDataURL(myCanvas),
                    owners: myOwners,
                });
                if (error) throw error;
                registered = true;
                status.textContent = "saved &gt_&lt";
            } catch (err) {
                console.error(err);
                dirty = true;
                status.textContent = "save failed :(";
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") saveMyTile();
        });
        window.addEventListener("pagehide", saveMyTile);
        window.addEventListener("beforeunload", saveMyTile);

        function flashHint() {
            hint.classList.add("show");
            setTimeout(() => hint.classList.remove("show"), 3000);
        }

        function makeOverlay() {
            const ov = document.createElement("div");
            ov.className = "gb-overlay";
            document.body.appendChild(ov);
            return ov;
        }

        function removeOverlay(ov) {
            if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
        }

        function showMergeRequestConfirm(targetSlot) {
            if (targetSlot === mySlot && ALLOW_SELF_MERGE) {
                const fakeReq = { id: "dev-self", from_slot: mySlot, to_slot: mySlot };
                showIncomingMergeRequest(fakeReq);
                return;
            }

            const ov = makeOverlay();
            ov.innerHTML = `
                <div class="gb-popup">
                    <h2>request merge?</h2>
                    <p>you're about to send a merge request to tile #${targetSlot}.</p>
                    <p>if they accept, your slot will be freed up for future visitors. you'll both be co-owners of their tile and can draw on it together.</p>
                    <p>the other person chooses what happens to the drawing.</p>
                    <div class="gb-btn-row">
                        <button class="gb-btn" id="gb-mreq-no">cancel</button>
                        <button class="gb-btn primary" id="gb-mreq-yes">send request</button>
                    </div>
                </div>`;
            ov.querySelector("#gb-mreq-no").addEventListener("click", () => removeOverlay(ov));
            ov.querySelector("#gb-mreq-yes").addEventListener("click", async () => {
                removeOverlay(ov);
                await sendMergeRequest(targetSlot);
            });
        }

        async function sendMergeRequest(targetSlot) {
            status.textContent = "sending...";
            try {
                const { error } = await supabase.from("merge_requests").insert({
                    from_slot: mySlot,
                    to_slot: targetSlot,
                    status: "pending",
                });
                if (error) throw error;
                slotHasPending.set(targetSlot, true);
                status.textContent = "request sent ^w^";
            } catch (err) {
                console.error(err);
                status.textContent = "already a pending request :(";
            }
        }

        function showIncomingMergeRequest(req) {
            const ov = makeOverlay();
            ov.innerHTML = `
                <div class="gb-popup">
                    <h2>merge request!</h2>
                    <p>tile #${req.from_slot} wants to merge into yours.</p>
                    <p>if you accept, their slot will be freed up for future visitors. youll both be co-owners of your tile and can draw on it together.</p>
                    <div class="gb-btn-row">
                        <button class="gb-btn" id="gb-inc-no">decline</button>
                        <button class="gb-btn primary" id="gb-inc-yes">accept</button>
                    </div>
                </div>`;
            ov.querySelector("#gb-inc-no").addEventListener("click", async () => {
                removeOverlay(ov);
                if (req.id !== "dev-self") {
                    await supabase.from("merge_requests").update({ status: "rejected" }).eq("id", req.id);
                    slotHasPending.delete(req.to_slot);
                }
            });
            ov.querySelector("#gb-inc-yes").addEventListener("click", () => {
                removeOverlay(ov);
                showMergeTypeSelect(req);
            });
        }

        function showMergeTypeSelect(req) {
            const ov = makeOverlay();
            ov.innerHTML = `
                <div class="gb-popup">
                    <h2>how should the drawing look?</h2>
                    <p>"mine" is your current drawing. "theirs" is the drawing from tile #${req.from_slot}.</p>
                    <div class="gb-merge-opts">
                        <label class="gb-merge-opt">
                            <input type="radio" name="gb-merge-mode" value="keep-mine" checked>
                            <label><strong>keep mine</strong><span>your drawing stays, theirs is discarded.</span></label>
                        </label>
                        <label class="gb-merge-opt">
                            <input type="radio" name="gb-merge-mode" value="keep-theirs">
                            <label><strong>keep theirs</strong><span>their drawing replaces yours.</span></label>
                        </label>
                        <label class="gb-merge-opt">
                            <input type="radio" name="gb-merge-mode" value="clear">
                            <label><strong>clear</strong><span>both drawings are cleared. (empty tile)</span></label>
                        </label>
                        <label class="gb-merge-opt">
                            <input type="radio" name="gb-merge-mode" value="mine-on-top">
                            <label><strong>merge - mine on top</strong><span>both blended, your drawing on top.</span></label>
                        </label>
                        <label class="gb-merge-opt">
                            <input type="radio" name="gb-merge-mode" value="theirs-on-top">
                            <label><strong>merge - theirs on top</strong><span>both blended, their drawing on top.</span></label>
                        </label>
                    </div>
                    <div class="gb-btn-row">
                        <button class="gb-btn" id="gb-mt-back">go back</button>
                        <button class="gb-btn primary" id="gb-mt-next">continue</button>
                    </div>
                </div>`;
            ov.querySelector("#gb-mt-back").addEventListener("click", () => {
                removeOverlay(ov);
                showIncomingMergeRequest(req);
            });
            ov.querySelector("#gb-mt-next").addEventListener("click", () => {
                const mode = ov.querySelector("input[name=gb-merge-mode]:checked").value;
                removeOverlay(ov);
                showMergeFinalConfirm(req, mode);
            });
        }

        function showMergeFinalConfirm(req, mode) {
            const modeLabels = {
                "keep-mine":     "keep your drawing",
                "keep-theirs":   "replace with their drawing",
                "clear":         "clear both drawings",
                "mine-on-top":   "blend both (yours on top)",
                "theirs-on-top": "blend both (theirs on top)",
            };
            const ov = makeOverlay();
            ov.innerHTML = `
                <div class="gb-popup">
                    <h2>are you sure?</h2>
                    <p>you're about to merge tile #${req.from_slot} into yours.</p>
                    <p>drawing: <strong>${modeLabels[mode]}</strong></p>
                    <p class="gb-warn">THIS CANNOT BE UNDONE!!</p>
                    <div class="gb-btn-row">
                        <button class="gb-btn" id="gb-mf-back">go back</button>
                        <button class="gb-btn danger" id="gb-mf-confirm">yes, merge</button>
                    </div>
                </div>`;
            ov.querySelector("#gb-mf-back").addEventListener("click", () => {
                removeOverlay(ov);
                showMergeTypeSelect(req);
            });
            ov.querySelector("#gb-mf-confirm").addEventListener("click", async () => {
                removeOverlay(ov);
                await executeMerge(req, mode);
            });
        }

        async function executeMerge(req, mode) {
            if (req.id === "dev-self") {
                status.textContent = "dev self-merge complete (no-op)";
                return;
            }
            status.textContent = "merging...";
            try {
                const { data: theirRow, error: fetchErr } = await supabase
                    .from("tiles")
                    .select("image, owners")
                    .eq("slot", req.from_slot)
                    .maybeSingle();
                if (fetchErr) throw fetchErr;

                let newImageData = null;

                if (mode === "keep-mine") {
                    newImageData = myCtx.getImageData(0, 0, TILE_W, TILE_H);
                } else if (mode === "clear") {
                    newImageData = null;
                } else {
                    let theirData = null;
                    if (isValidImage(theirRow?.image)) {
                        theirData = await imgSrcToImageData(theirRow.image).catch(() => null);
                    }
                    if (mode === "keep-theirs") {
                        newImageData = theirData;
                    } else if (mode === "mine-on-top") {
                        newImageData = blendImages(theirData, myCtx.getImageData(0, 0, TILE_W, TILE_H));
                    } else if (mode === "theirs-on-top") {
                        newImageData = blendImages(myCtx.getImageData(0, 0, TILE_W, TILE_H), theirData);
                    }
                }

                snapshotForUndo();
                if (newImageData) {
                    myCtx.putImageData(newImageData, 0, 0);
                } else {
                    myCtx.fillStyle = DEFAULT_BG;
                    myCtx.fillRect(0, 0, TILE_W, TILE_H);
                }

                const theirOwners = Array.isArray(theirRow?.owners) ? theirRow.owners : [];
                const newOwners = [...new Set([...myOwners, ...theirOwners])];
                myOwners = newOwners;

                const newImageSrc = await canvasToLosslessDataURL(myCanvas);
                const { error: saveErr } = await supabase.from("tiles").upsert({
                    slot: mySlot,
                    image: newImageSrc,
                    owners: myOwners,
                });
                if (saveErr) throw saveErr;

                const { error: absorbErr } = await supabase.from("tiles").upsert({
                    slot: req.from_slot,
                    image: '',
                    owners: [],
                });
                if (absorbErr) throw absorbErr;

                await supabase.from("merge_requests").update({ status: "accepted" }).eq("id", req.id);

                const theirCanvas = tileBySlot.get(req.from_slot);
                if (theirCanvas) {
                    const tc = theirCanvas.getContext("2d");
                    tc.fillStyle = DEFAULT_BG;
                    tc.fillRect(0, 0, TILE_W, TILE_H);
                }

                slotHasPending.delete(req.to_slot);
                dirty = false;
                status.textContent = "merged! ^w^";
            } catch (err) {
                console.error(err);
                status.textContent = "merge failed :(";
            }
        }

        function blendImages(bottom, top) {
            const tmp = document.createElement("canvas");
            tmp.width = TILE_W; tmp.height = TILE_H;
            const ctx = tmp.getContext("2d");
            ctx.fillStyle = DEFAULT_BG;
            ctx.fillRect(0, 0, TILE_W, TILE_H);
            if (bottom) ctx.putImageData(bottom, 0, 0);
            if (top) {
                const tmp2 = document.createElement("canvas");
                tmp2.width = TILE_W; tmp2.height = TILE_H;
                tmp2.getContext("2d").putImageData(top, 0, 0);
                ctx.drawImage(tmp2, 0, 0);
            }
            return ctx.getImageData(0, 0, TILE_W, TILE_H);
        }

        async function init() {
            status.textContent = "connectiting...";

            let { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                await supabase.auth.signInAnonymously();
                ({ data: { session } } = await supabase.auth.getSession());
            }
            userId = session.user.id;

            const { data: rows, error } = await supabase
                .from("tiles")
                .select("slot, owners")
                .order("slot")
                .limit(10000);

            if (error) { status.textContent = "error :("; console.error(error); return; }

            const myRow = rows.find(r => Array.isArray(r.owners) && r.owners.includes(userId));

            let mySlot_new;
            if (myRow) {
                mySlot_new = myRow.slot;
            } else {
                const takenSlots = new Set(rows.filter(r => Array.isArray(r.owners) && r.owners.length > 0).map(r => r.slot));
                let candidate = 0;
                while (takenSlots.has(candidate)) candidate++;
                mySlot_new = candidate;
            }
            mySlot = mySlot_new;
            myOwners = myRow?.owners ?? [userId];

            const { data: pendingReqs } = await supabase
                .from("merge_requests")
                .select("id, from_slot, to_slot, status")
                .eq("status", "pending");

            if (pendingReqs) {
                for (const r of pendingReqs) slotHasPending.set(r.to_slot, true);

                const incoming = pendingReqs.find(r => r.to_slot === mySlot && r.from_slot !== mySlot);
                if (incoming) setTimeout(() => showIncomingMergeRequest(incoming), 1200);
            }

            for (const row of rows) {
                if (row.slot === mySlot) continue;
                createTileCanvas(row.slot, null);
            }

            async function loadTileImages(slots) {
                for (const slot of slots) {
                    const { data: imgRow } = await supabase
                        .from("tiles")
                        .select("image")
                        .eq("slot", slot)
                        .maybeSingle();
                    if (imgRow && isValidImage(imgRow.image)) {
                        imgSrcToImageData(imgRow.image)
                            .then(id => {
                                const c = tileBySlot.get(slot);
                                if (c) c.getContext("2d").putImageData(id, 0, 0);
                            })
                            .catch(() => {});
                    }
                }
            }
            loadTileImages(rows.filter(r => r.slot !== mySlot).map(r => r.slot));

            createMyCanvas(mySlot);

            if (myRow) {
                registered = true;
                const { data: myImgRow } = await supabase
                    .from("tiles")
                    .select("image")
                    .eq("slot", mySlot)
                    .maybeSingle();
                const myImage = myImgRow?.image ?? null;
                if (myImage) {
                    imgSrcToImageData(myImage).then(id => {
                        loadMyImage(id);
                        if (!myImage.startsWith("rawrgba:")) {
                            dirty = true; scheduleSave();
                        }
                    }).catch(() => loadMyImage(null));
                } else {
                    loadMyImage(null);
                }
            } else {
                loadMyImage(null);
            }

            status.textContent = "readyy";
            flashHint();
            requestAnimationFrame(scrollToMyTile);

            supabase.channel("tiles-channel")
                .on("postgres_changes", { event: "*", schema: "public", table: "tiles" }, payload => {
                    const row = payload.new;
                    if (!row || row.slot === mySlot) return;

                    const existing = tileBySlot.get(row.slot);
                    if (existing) { existing.remove(); tileBySlot.delete(row.slot); }

                    const finish = id => createTileCanvas(row.slot, id);
                    if (isValidImage(row.image)) {
                        imgSrcToImageData(row.image).then(finish).catch(() => finish(null));
                    } else {
                        finish(null);
                    }
                })
                .subscribe();

            supabase.channel("merge-requests-channel")
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "merge_requests",
                }, payload => {
                    const req = payload.new;
                    if (!req) return;
                    if (req.to_slot === mySlot && req.from_slot !== mySlot) {
                        slotHasPending.set(req.to_slot, true);
                        showIncomingMergeRequest(req);
                    }
                })
                .on("postgres_changes", {
                    event: "UPDATE",
                    schema: "public",
                    table: "merge_requests",
                }, payload => {
                    const req = payload.new;
                    if (!req) return;
                    if (req.from_slot === mySlot) {
                        if (req.status === "accepted") {
                            status.textContent = "merge accepted! reloading...";
                            setTimeout(() => location.reload(), 1500);
                        } else if (req.status === "rejected") {
                            slotHasPending.delete(req.to_slot);
                            status.textContent = "merge declined :(";
                        }
                    }
                })
                .subscribe();
        }

        init();
    </script>
    <script src="cursor.js"></script>
</body>
